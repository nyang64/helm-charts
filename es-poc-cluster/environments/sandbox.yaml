# Sandbox -- 500 GB raw x 3 replicas = 1.5 TB total across 2 data pods (~750 GB each, rounded to 1Ti).
# Security posture matches nonprod/prod: xpack.security on, TLS on, Istio mTLS.
# Usage: helm template es-poc-cluster . -f environments/sandbox.yaml
#
# Pre-requisites:
#   cert-manager must be installed (for transport TLS)
#   Istio must be installed
#   kubectl create secret generic es-sandbox-elastic-secret \
#     --from-literal=ELASTIC_PASSWORD=<strong-password> -n <namespace>

clusterName: es-sandbox
fullnameOverride: "es-sandbox"

istio:
  enabled: true   # Istio handles HTTP TLS (9200); cert-manager handles transport TLS (9300)
  gateway:
    selector:
      istio: ingressgateway
    hostname: ""   # no external hostname for sandbox -- use port-forward for access
    tls:
      mode: SIMPLE
      credentialName: ""

# Disable privileged sysctl init container -- set vm.max_map_count on the node instead.
sysctl:
  enabled: false

security:
  enabled: true

tls:
  enabled: true
  secretName: "es-sandbox-tls"
  issuerName: "es-sandbox-issuer"

elasticPassword:
  existingSecret: "es-sandbox-elastic-secret"

# Master -- 1 node, minimal: tracks 2 data nodes + a handful of shards
master:
  replicas: 1
  heapSize: "512m"       # tiny cluster state; 512 MB heap is more than enough
  antiAffinity: "disabled"
  bootstrapped: false
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"      # heap(512m) + OS overhead; set equal to limits for Guaranteed QoS
    limits:
      cpu: "500m"
      memory: "1Gi"
  storage:
    size: "10Gi"          # cluster state + logs only, no index data on master

# Data -- 2 pods x 1 Ti each = 2 Ti raw capacity; with replication covers 500 GB x 3
data:
  replicas: 2
  heapSize: "2g"         # 50% of 4 Gi RAM; leaves 2 Gi for Lucene OS page cache
  antiAffinity: "disabled"
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"      # heap(2g) x 2 -- equal requests/limits for Guaranteed QoS
    limits:
      cpu: "2000m"
      memory: "4Gi"
  storage:
    size: "1Ti"           # 1 TiB per pod (~1.1 TB); covers 750 GB with headroom

# Ingest+ML -- 1 pod; needs extra native memory for model weights on top of heap.
ingest:
  replicas: 1
  heapSize: "512m"
  mlEnabled: true
  antiAffinity: "disabled"
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"      # heap(512m) + JVM overhead + ~3Gi native memory for model weights
    limits:
      cpu: "2000m"
      memory: "4Gi"

# Generous startup window -- sandbox clusters are slow to form, and ML model load adds time.
probes:
  liveness:
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 15
    failureThreshold: 5

pdb:
  master:
    enabled: false   # 1 replica -- PDB would block all voluntary disruptions
  data:
    enabled: false
  ingest:
    enabled: false   # 1 replica -- PDB would block all voluntary disruptions

# Snapshot / backup -- NetApp HPOS S3 on-prem.
# Pre-requisite:
#   kubectl create secret generic es-snapshot-s3-creds \
#     --from-literal=access_key=<hpos-access-key> \
#     --from-literal=secret_key=<hpos-secret-key> -n <namespace>
snapshot:
  enabled: true
  repository:
    name: "backup"
    type: "s3"
    s3:
      bucket: "es-sandbox-snapshots"
      endpoint: "netapp-hpos.your-corp.internal"   # update to actual NetApp HPOS endpoint
      pathStyleAccess: true
      protocol: "https"
      credentialsSecret: "es-snapshot-s3-creds"
  slm:
    schedule: "0 30 2 * * ?"    # daily at 02:30 UTC
    retention:
      expireAfter: "7d"          # shorter retention for sandbox
      minCount: 3
      maxCount: 10

