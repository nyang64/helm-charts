# Sandbox -- 3 master + 3 data nodes; 100 Gi per data pod = 300 Gi raw.
# Security posture matches nonprod/prod: xpack.security on, TLS on, Istio mTLS.
# Usage: helm template es-poc-cluster . -f environments/sandbox.yaml -n <namespace>
#   -n is required: without it Helm falls back to the active kubeconfig namespace,
#   making generated YAML non-reproducible across machines and CI runs.
#
# Pre-requisites:
#   cert-manager must be installed (for transport TLS)
#   Istio must be installed
#   kubectl create secret generic es-sandbox-elastic-secret \
#     --from-literal=ELASTIC_PASSWORD=<strong-password> -n <namespace>
#
#   vm.max_map_count=262144 must be set on every worker node BEFORE deploying.
#   If the OpenShift 'privileged' SCC is blocked in this namespace, disable
#   sysctl.enabled and use the Node Tuning Operator instead (platform-team prereq):
#
#     kubectl apply -f - <<EOF
#     apiVersion: tuned.openshift.io/v1
#     kind: Tuned
#     metadata:
#       name: es-vm-max-map-count
#       namespace: openshift-cluster-node-tuning-operator
#     spec:
#       profile:
#         - name: es-max-map-count
#           data: |
#             [main]
#             summary=Elasticsearch vm.max_map_count tuning
#             [sysctl]
#             vm.max_map_count=262144
#       recommend:
#         - match:
#             - label: node-role.kubernetes.io/worker
#           priority: 20
#           profile: es-max-map-count
#     EOF
#
#   Verify after applying (allow ~60s for NTO to apply the profile):
#     oc debug node/<worker-node> -- chroot /host sysctl vm.max_map_count
#   Expected: vm.max_map_count = 262144

clusterName: es-sandbox
fullnameOverride: "es-sandbox"

istio:
  enabled: true   # Istio handles HTTP TLS (9200); cert-manager handles transport TLS (9300)
  gateway:
    selector:
      istio: ingressgateway
    hostname: ""   # no external hostname for sandbox -- use port-forward for access
    tls:
      mode: SIMPLE
      credentialName: ""
  allowedNamespaces: []   # add namespaces of in-cluster apps that call ES directly, e.g. ["my-app"]

sysctl:
  enabled: true

security:
  enabled: true

tls:
  enabled: true
  secretName: "es-sandbox-tls"
  issuerName: "es-sandbox-issuer"

elasticPassword:
  existingSecret: "es-sandbox-elastic-secret"

# Master -- 3 nodes; quorum-safe even in sandbox
master:
  replicas: 3
  heapSize: "512m"       # small cluster state; 512 MB heap is more than enough
  antiAffinity: "preferred"
  bootstrapped: false
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"      # heap(512m) + OS overhead; set equal to limits for Guaranteed QoS
    limits:
      cpu: "500m"
      memory: "1Gi"
  storage:
    size: "10Gi"          # cluster state + logs only, no index data on master

# Data -- 3 pods x 100 Gi each = 300 Gi raw capacity
data:
  replicas: 3
  heapSize: "2g"         # 50% of 4 Gi RAM; leaves 2 Gi for Lucene OS page cache
  antiAffinity: "preferred"
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"      # heap(2g) x 2 -- equal requests/limits for Guaranteed QoS
    limits:
      cpu: "2000m"
      memory: "4Gi"
  storage:
    size: "100Gi"

# Generous startup window -- sandbox clusters are slow to form.
probes:
  liveness:
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 15
    failureThreshold: 5

pdb:
  master:
    enabled: true
    minAvailable: 2   # quorum requires at least 2 of 3 masters
  data:
    enabled: true
    minAvailable: 2   # tolerates loss of 1 out of 3 data pods

# Snapshot / backup disabled in sandbox -- no S3 egress or keystore init overhead.
# To enable, set enabled: true and fill in bucket/endpoint/credentialsSecret.
snapshot:
  enabled: false
  repository:
    name: "backup"
    type: "s3"
    s3:
      bucket: "es-sandbox-snapshots"
      endpoint: "netapp-hpos.your-corp.internal"   # update to actual NetApp HPOS endpoint
      pathStyleAccess: true
      protocol: "https"
      credentialsSecret: "es-snapshot-s3-creds"
  slm:
    schedule: "0 30 2 * * ?"    # daily at 02:30 UTC
    retention:
      expireAfter: "7d"          # shorter retention for sandbox
      minCount: 3
      maxCount: 10
