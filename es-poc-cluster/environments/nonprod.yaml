# Non-production -- 9-15 TB raw x 3 replicas = half of prod capacity across 5 data pods.
# Per-pod storage matches prod (3Ti each) because half the data with half the nodes
# works out to the same per-node footprint.
# Usage: helm template es-poc-cluster . -f environments/nonprod.yaml -n <namespace>
#   -n is required: without it Helm falls back to the active kubeconfig namespace,
#   making generated YAML non-reproducible across machines and CI runs.

clusterName: es-nonprod
fullnameOverride: "es-nonprod"

istio:
  enabled: true   # Istio handles HTTP TLS (9200); cert-manager handles transport TLS (9300)
  gateway:
    selector:
      istio: ingressgateway   # adjust if your cluster uses a different gateway pod label
    hostname: "es-nonprod.your-corp.com"
    tls:
      mode: SIMPLE
      credentialName: "es-nonprod-gateway-tls"   # TLS secret must exist in istio-system namespace
  allowedNamespaces: []   # add namespaces of in-cluster apps that call ES directly, e.g. ["my-app"]

sysctl:
  enabled: true

security:
  enabled: true

tls:
  enabled: true
  secretName: "es-nonprod-tls"
  issuerName: "es-nonprod-issuer"

elasticPassword:
  existingSecret: "es-nonprod-elastic-secret"   # create before first deploy:
  # kubectl create secret generic es-nonprod-elastic-secret \
  #   --from-literal=ELASTIC_PASSWORD="<strong-password>" -n <namespace>

# Master -- 3 nodes managing a 3-data-node cluster.
# Cluster state is proportionally smaller than prod (~half the shards/indices).
master:
  replicas: 3
  heapSize: "2g"         # tracks ~150 shards; 2 GB heap is comfortable
  antiAffinity: "preferred"
  bootstrapped: false
  resources:
    requests:
      cpu: "250m"        # cluster management is mostly single-threaded; low CPU ceiling
      memory: "4Gi"      # heap(2g) x 2
    limits:
      cpu: "1000m"
      memory: "4Gi"
  storage:
    size: "20Gi"          # cluster state + logs only

# Data -- 5 pods x 3 Ti each = 15 Ti raw; covers 5 TB x 3 replicas upper bound.
# int8_hnsw graph ~225 GB total / 5 pods = ~45 GB per pod. 24 Gi page cache gives
# ~50% cache coverage -- some HNSW reads will hit disk, acceptable for nonprod testing.
data:
  replicas: 5
  heapSize: "8g"         # 25% of 32 Gi; extra headroom intentionally left for page cache
  antiAffinity: "preferred"
  resources:
    requests:
      cpu: "2000m"
      memory: "32Gi"     # 8g heap + 24 Gi page cache for int8_hnsw (partial coverage)
    limits:
      cpu: "4000m"
      memory: "32Gi"
  storage:
    size: "3Ti"           # 3 TiB per pod (~3.3 TB); 5 pods = 15 Ti total raw

probes:
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

pdb:
  master:
    enabled: true
    minAvailable: 2   # quorum requires at least 2 of 3 masters
  data:
    enabled: true
    minAvailable: 3   # tolerates loss of 2 out of 5 data pods

# Snapshot / backup -- NetApp HPOS S3 on-prem.
# Pre-requisite:
#   kubectl create secret generic es-snapshot-s3-creds \
#     --from-literal=access_key=<hpos-access-key> \
#     --from-literal=secret_key=<hpos-secret-key> -n <namespace>
snapshot:
  enabled: true
  repository:
    name: "backup"
    type: "s3"
    s3:
      bucket: "es-nonprod-snapshots"
      endpoint: "netapp-hpos.your-corp.internal"   # update to actual NetApp HPOS endpoint
      pathStyleAccess: true
      protocol: "https"
      credentialsSecret: "es-snapshot-s3-creds"
  slm:
    schedule: "0 30 1 * * ?"    # daily at 01:30 UTC
    retention:
      expireAfter: "14d"
      minCount: 5
      maxCount: 30

