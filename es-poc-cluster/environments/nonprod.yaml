# Non-production — 9–15 TB raw × 3 replicas = half of prod capacity across 3 data pods.
# Per-pod storage matches prod (5 Ti each) because half the data with half the nodes
# works out to the same per-node footprint.
# Usage: helm template es-poc-cluster . -f environments/nonprod.yaml

clusterName: es-nonprod

sysctl:
  enabled: true

security:
  enabled: true

tls:
  enabled: true
  secretName: "es-nonprod-tls"
  issuerName: "es-nonprod-issuer"

elasticPassword:
  existingSecret: ""
  password: "changeme-nonprod"   # rotate before first deployment

# Master — 3 nodes managing a 3-data-node cluster.
# Cluster state is proportionally smaller than prod (~half the shards/indices).
master:
  replicas: 3
  heapSize: "2g"         # tracks ~150 shards; 2 GB heap is comfortable
  antiAffinity: "preferred"
  bootstrapped: false
  resources:
    requests:
      cpu: "250m"        # cluster management is mostly single-threaded; low CPU ceiling
      memory: "4Gi"      # heap(2g) × 2
    limits:
      cpu: "1000m"
      memory: "4Gi"
  storage:
    size: "20Gi"          # cluster state + logs only

# Data — 5 pods × 3 Ti each = 15 Ti raw; covers 5 TB × 3 replicas upper bound.
data:
  replicas: 5
  heapSize: "8g"         # 50% of 16 Gi RAM; leaves 8 Gi for Lucene OS page cache
  antiAffinity: "preferred"
  resources:
    requests:
      cpu: "2000m"
      memory: "16Gi"     # heap(8g) × 2
    limits:
      cpu: "4000m"
      memory: "16Gi"
  storage:
    size: "3Ti"           # 3 TiB per pod (~3.3 TB); 5 pods = 15 Ti total raw

# Ingest — 2 pods; matches prod heap so pipeline behaviour is realistic in testing.
ingest:
  replicas: 2
  heapSize: "4g"
  antiAffinity: "preferred"
  resources:
    requests:
      cpu: "2000m"
      memory: "8Gi"      # heap(4g) × 2
    limits:
      cpu: "4000m"
      memory: "8Gi"

probes:
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

pdb:
  master:
    enabled: true
    minAvailable: 2   # quorum requires at least 2 of 3 masters
  data:
    enabled: true
    minAvailable: 3   # tolerates loss of 2 out of 5 data pods

ad:
  enabled: true
  existingSecret: "es-nonprod-ad-secret"
  domainName: "your-corp.com"
  url: "ldaps://ad-nonprod.your-corp.com:636"
  bindDn: "CN=es-svc,OU=ServiceAccounts,DC=your-corp,DC=com"
  userSearchBaseDn: "OU=Users,DC=your-corp,DC=com"
  groupSearchBaseDn: "OU=Groups,DC=your-corp,DC=com"
  adminGroupDn: "CN=ES-Admins,OU=Groups,DC=your-corp,DC=com"
  dataUserGroupDn: "CN=ES-DataUsers,OU=Groups,DC=your-corp,DC=com"
