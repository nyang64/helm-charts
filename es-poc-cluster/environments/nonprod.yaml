# Non-production -- 9-15 TB raw x 3 replicas = half of prod capacity across 5 data pods.
# Per-pod storage matches prod (3Ti each) because half the data with half the nodes
# works out to the same per-node footprint.
# Usage: helm template es-poc-cluster . -f environments/nonprod.yaml

clusterName: es-nonprod
fullnameOverride: "es-nonprod"

istio:
  enabled: true   # Istio handles HTTP TLS (9200); cert-manager handles transport TLS (9300)
  gateway:
    selector:
      istio: ingressgateway   # adjust if your cluster uses a different gateway pod label
    hostname: "es-nonprod.your-corp.com"
    tls:
      mode: SIMPLE
      credentialName: "es-nonprod-gateway-tls"   # TLS secret must exist in istio-system namespace
  allowedNamespaces: []   # add namespaces of in-cluster apps that call ES directly, e.g. ["my-app"]

sysctl:
  enabled: true

security:
  enabled: true

tls:
  enabled: true
  secretName: "es-nonprod-tls"
  issuerName: "es-nonprod-issuer"

elasticPassword:
  existingSecret: "es-nonprod-elastic-secret"   # create before first deploy:
  # kubectl create secret generic es-nonprod-elastic-secret \
  #   --from-literal=ELASTIC_PASSWORD="<strong-password>" -n <namespace>

# Master -- 3 nodes managing a 3-data-node cluster.
# Cluster state is proportionally smaller than prod (~half the shards/indices).
master:
  replicas: 3
  heapSize: "2g"         # tracks ~150 shards; 2 GB heap is comfortable
  antiAffinity: "preferred"
  bootstrapped: false
  resources:
    requests:
      cpu: "250m"        # cluster management is mostly single-threaded; low CPU ceiling
      memory: "4Gi"      # heap(2g) x 2
    limits:
      cpu: "1000m"
      memory: "4Gi"
  storage:
    size: "20Gi"          # cluster state + logs only

# Data -- 5 pods x 3 Ti each = 15 Ti raw; covers 5 TB x 3 replicas upper bound.
# int8_hnsw graph ~225 GB total / 5 pods = ~45 GB per pod. 24 Gi page cache gives
# ~50% cache coverage -- some HNSW reads will hit disk, acceptable for nonprod testing.
data:
  replicas: 5
  heapSize: "8g"         # 25% of 32 Gi; extra headroom intentionally left for page cache
  antiAffinity: "preferred"
  resources:
    requests:
      cpu: "2000m"
      memory: "32Gi"     # 8g heap + 24 Gi page cache for int8_hnsw (partial coverage)
    limits:
      cpu: "4000m"
      memory: "32Gi"
  storage:
    size: "3Ti"           # 3 TiB per pod (~3.3 TB); 5 pods = 15 Ti total raw

# Ingest+ML -- 2 pods; matches prod heap so pipeline and model behaviour is realistic in testing.
# 16Gi = 4g heap + ~4Gi JVM overhead + ~8Gi native memory for ML model weights.
ingest:
  replicas: 2
  heapSize: "4g"
  mlEnabled: true
  antiAffinity: "preferred"
  resources:
    requests:
      cpu: "2000m"
      memory: "16Gi"     # heap(4g) + JVM overhead + ~8Gi for ML model weights
    limits:
      cpu: "4000m"
      memory: "16Gi"

probes:
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

pdb:
  master:
    enabled: true
    minAvailable: 2   # quorum requires at least 2 of 3 masters
  data:
    enabled: true
    minAvailable: 3   # tolerates loss of 2 out of 5 data pods
  ingest:
    enabled: true
    minAvailable: 1   # keep 1 of 2 ingest pods available at all times

ad:
  enabled: true
  existingSecret: "es-nonprod-ad-secret"
  domainName: "your-corp.com"
  url: "ldaps://ad-nonprod.your-corp.com:636"
  bindDn: "CN=es-svc,OU=ServiceAccounts,DC=your-corp,DC=com"
  userSearchBaseDn: "OU=Users,DC=your-corp,DC=com"
  groupSearchBaseDn: "OU=Groups,DC=your-corp,DC=com"
  adminGroupDn: "CN=ES-Admins,OU=Groups,DC=your-corp,DC=com"
  dataUserGroupDn: "CN=ES-DataUsers,OU=Groups,DC=your-corp,DC=com"

# JWT realm -- enable when the API gateway is wired to pass Bearer tokens to ES.
# Realm chain: file(0/built-in) -> jwt1(2) -> ad1(3) -> native(built-in/last). Both realms can be active simultaneously.
# Set jwksetPath to <allowedIssuer>/.well-known/jwks.json (or a local file path for air-gapped).
jwt:
  enabled: false   # flip to true once IdP and API gateway are configured
  allowedIssuer: "https://your-idp-nonprod.your-corp.com"
  allowedAudiences:
    - "es-nonprod"
  jwksetPath: "https://your-idp-nonprod.your-corp.com/.well-known/jwks.json"
  adminGroup: "ES-Admins"        # must match the 'groups' claim value in JWT tokens
  dataUserGroup: "ES-DataUsers"
