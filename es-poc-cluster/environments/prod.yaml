# Production -- 18-30 TB raw x 3 replicas across 10 data pods (3-5 Ti per pod).
# Sized for 5 Ti per pod to cover the upper bound with headroom.
# All secrets must be pre-created externally -- no passwords in this file.
# Usage: helm template es-poc-cluster . -f environments/prod.yaml
#
# Pre-requisites:
#   kubectl create secret generic es-prod-elastic-secret \
#     --from-literal=ELASTIC_PASSWORD=<vault-sourced-password> -n dia-es-poc
#   kubectl create secret generic es-prod-ad-secret \
#     --from-literal=AD_BIND_PASSWORD=<vault-sourced-password> -n dia-es-poc

clusterName: es-prod
fullnameOverride: "es-prod"

istio:
  enabled: true   # Istio handles HTTP TLS (9200); cert-manager handles transport TLS (9300)
  gateway:
    selector:
      istio: ingressgateway   # adjust if your cluster uses a different gateway pod label
    hostname: "es-prod.your-corp.com"
    tls:
      mode: SIMPLE
      credentialName: "es-prod-gateway-tls"   # TLS secret must exist in istio-system namespace

sysctl:
  enabled: true

security:
  enabled: true

tls:
  enabled: true
  secretName: "es-prod-tls"
  issuerName: "es-prod-issuer"

elasticPassword:
  existingSecret: "es-prod-elastic-secret"   # no password field -- external secret only

# Master -- 3 nodes managing 6 data nodes.
# Cluster state is proportional to shard count, not data volume.
# Estimated 6 nodes x ~50 shards each = ~300 shards; 4 GB heap is ample.
# Master is NOT in the data path -- keep CPU allocation conservative.
master:
  replicas: 3
  heapSize: "4g"         # ~1 GB per 3000 shards; 4 GB handles large index counts comfortably
  antiAffinity: "required"   # hard rule: no two master pods on the same node
  bootstrapped: true         # cluster already formed; removes cluster.initial_master_nodes
  resources:
    requests:
      cpu: "500m"        # cluster state diffs and election are low-CPU; reserve burst headroom
      memory: "8Gi"      # heap(4g) x 2; other half is OS overhead + GC buffers
    limits:
      cpu: "2000m"
      memory: "8Gi"
  storage:
    size: "30Gi"          # cluster state snapshots + translog + logs; no index data

# Data -- 10 pods x 3 Ti each = 30 Ti raw capacity; covers 10 TB x 3 replicas upper bound.
# int8_hnsw graph estimate: ~450 GB total / 10 pods = ~45 GB per pod must fit in page cache.
# Heap intentionally kept at 16g (25% of 64 Gi) so the remaining 48 Gi goes to OS page cache
# for the HNSW graph -- vector search is page-cache-bound, not heap-bound.
data:
  replicas: 10
  heapSize: "16g"        # do not exceed 31 GB (compressed OOP limit); 16g is ample for ES ops
  antiAffinity: "preferred"   # best-effort spread; 'required' would block large batch deploys
  resources:
    requests:
      cpu: "4000m"       # kNN search is memory-bound; 4 cores handles concurrent queries
      memory: "64Gi"     # 16g heap + 48 Gi page cache to hold int8_hnsw graph in memory
    limits:
      cpu: "8000m"
      memory: "64Gi"
  storage:
    size: "3Ti"           # 3 TiB per pod (~3.3 TB); 10 pods = 30 Ti total raw

# Ingest+ML -- 3 pods; embedding is now in both read and write paths so we add a third
# pod for redundancy and to share concurrent query + indexing inference load.
# 24Gi = 8g heap + ~8Gi JVM overhead/buffers + ~8Gi native memory for ML model weights.
ingest:
  replicas: 3
  heapSize: "8g"
  mlEnabled: true
  antiAffinity: "preferred"
  resources:
    requests:
      cpu: "4000m"       # ML inference is CPU-intensive; 4 cores handles concurrent requests
      memory: "24Gi"     # heap(8g) + JVM overhead + ~8Gi for ML model weights
    limits:
      cpu: "8000m"
      memory: "24Gi"

# Tighter probes for prod -- detect unhealthy pods faster.
probes:
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

pdb:
  master:
    enabled: true
    minAvailable: 2   # quorum intact with 2 of 3 masters; tolerates 1 voluntary disruption
  data:
    enabled: true
    minAvailable: 8   # tolerates 2 simultaneous data node disruptions out of 10

ad:
  enabled: true
  existingSecret: "es-prod-ad-secret"
  domainName: "your-corp.com"
  url: "ldaps://ad.your-corp.com:636"
  bindDn: "CN=es-svc,OU=ServiceAccounts,DC=your-corp,DC=com"
  userSearchBaseDn: "OU=Users,DC=your-corp,DC=com"
  groupSearchBaseDn: "OU=Groups,DC=your-corp,DC=com"
  adminGroupDn: "CN=ES-Admins,OU=Groups,DC=your-corp,DC=com"
  dataUserGroupDn: "CN=ES-DataUsers,OU=Groups,DC=your-corp,DC=com"
