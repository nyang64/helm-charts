{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aimlp-search.fullname" . }}
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
spec:
  secretName: {{ include "aimlp-search.tlsSecretName" . }}
  duration: {{ .Values.tls.duration }}
  renewBefore: {{ .Values.tls.renewBefore }}
  # usages must include both serverAuth and clientAuth because ES transport TLS is mutual:
  # each node simultaneously acts as TLS server (accepting connections) and TLS client
  # (initiating connections). JDK 17+ enforces Extended Key Usage -- omitting either EKU
  # causes the TLS handshake to fail and prevents cluster formation.
  usages:
    - server auth
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: {{ include "aimlp-search.tlsIssuerName" . }}
    kind: Issuer
  dnsNames:
    - {{ include "aimlp-search.fullname" . }}
    - {{ include "aimlp-search.fullname" . }}-master-headless
    - {{ include "aimlp-search.fullname" . }}-data-headless
    - {{ include "aimlp-search.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
    - {{ include "aimlp-search.fullname" . }}-master-headless.{{ .Release.Namespace }}.svc.cluster.local
    - {{ include "aimlp-search.fullname" . }}-data-headless.{{ .Release.Namespace }}.svc.cluster.local
    - "*.{{ include "aimlp-search.fullname" . }}-master-headless.{{ .Release.Namespace }}.svc.cluster.local"
    - "*.{{ include "aimlp-search.fullname" . }}-data-headless.{{ .Release.Namespace }}.svc.cluster.local"
{{- end }}
