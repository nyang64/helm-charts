apiVersion: v1
kind: Service
metadata:
  name: {{ include "aimlp-search.fullname" . }}-data-headless
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
    role: data
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "aimlp-search.selectorLabels" . | nindent 4 }}
    role: data
  ports:
    - name: transport
      port: 9300
      targetPort: 9300
