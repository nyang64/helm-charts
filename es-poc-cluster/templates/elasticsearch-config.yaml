apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}-config
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
data:
  elasticsearch.yml: |
    cluster.name: {{ .Values.clusterName | quote }}
    network.host: "0.0.0.0"

    {{- if .Values.security.enabled }}
    xpack.security.enabled: true
    {{- if .Values.tls.enabled }}
    # xpack.security.ssl.reload.enabled: ES watches cert files on disk and hot-reloads them
    # when cert-manager rotates the Secret, without requiring a pod restart.
    # Documented in ES 8.x: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-settings.html
    # If this causes startup errors on your ES version, remove it and use the reload API instead:
    #   POST /_nodes/reload_secure_settings
    xpack.security.ssl.reload.enabled: true
    xpack.security.transport.ssl.enabled: true
    xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/tls.crt
    xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/tls.key
    xpack.security.transport.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.crt
    xpack.security.transport.ssl.verification_mode: certificate
    {{- if not .Values.istio.enabled }}
    xpack.security.http.ssl.enabled: true
    xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/tls.crt
    xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/tls.key
    xpack.security.http.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.crt
    {{- end }}
    {{- end }}
    {{- else }}
    xpack.security.enabled: false
    {{- end }}
    {{- if and .Values.snapshot.enabled (eq .Values.snapshot.repository.type "s3") }}
    {{- if .Values.snapshot.repository.s3.endpoint }}
    {{- /* ES 9.x: endpoint must be a full URL; standalone s3.client.*.protocol is a no-op. */}}
    s3.client.default.endpoint: {{ printf "%s://%s" .Values.snapshot.repository.s3.protocol .Values.snapshot.repository.s3.endpoint | quote }}
    {{- end }}
    {{- if .Values.snapshot.repository.s3.region }}
    s3.client.default.region: {{ .Values.snapshot.repository.s3.region | quote }}
    {{- end }}
    s3.client.default.path_style_access: {{ .Values.snapshot.repository.s3.pathStyleAccess }}
    {{- end }}
    {{- if .Values.esConfig }}
    {{ .Values.esConfig | toYaml | trim | nindent 4 }}
    {{- end }}

