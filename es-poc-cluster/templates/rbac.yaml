{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aimlp-search.fullname" . }}
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aimlp-search.fullname" . }}
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aimlp-search.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aimlp-search.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
