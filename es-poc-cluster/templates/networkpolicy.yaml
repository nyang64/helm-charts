{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "es-poc-cluster.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "es-poc-cluster.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9200
        - port: 9300
    # Open port 9200 to all pods. When istio.enabled=true, AuthorizationPolicy provides
    # the real access control -- this rule exists so Istio's iptables interception
    # is not blocked at the NetworkPolicy layer. When Istio is disabled (dev/test),
    # xpack security handles authentication; restrict further if required by policy.
    - ports:
        - port: 9200
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "es-poc-cluster.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9200
        - port: 9300
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.ad.enabled }}
    - ports:
        - port: 636
          protocol: TCP
        {{- if hasPrefix "ldap://" .Values.ad.url }}
        - port: 389
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if or (and .Values.jwt.enabled (hasPrefix "https://" .Values.jwt.jwksetPath)) .Values.ingest.mlEnabled }}
    # Port 443 egress:
    #   jwt.enabled + HTTPS jwksetPath: ES pods fetch public signing keys from IdP at startup
    #   ingest.mlEnabled: model-loader Job (same pod selector) fetches model from HuggingFace
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- if .Values.istio.enabled }}
    # istiod control-plane egress -- required for Envoy sidecar XDS config and mTLS cert issuance.
    # Without this rule the sidecar cannot bootstrap and the pod never reaches Ready.
    - ports:
        - port: 15012
          protocol: TCP
        - port: 15010
          protocol: TCP
    {{- end }}
{{- end }}
