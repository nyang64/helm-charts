{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aimlp-search.fullname" . }}
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aimlp-search.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: role
        operator: NotIn
        values: [kibana]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aimlp-search.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9200
        - port: 9300
    # Open port 9200 to all pods. When istio.enabled=true, AuthorizationPolicy provides
    # the real access control -- this rule exists so Istio's iptables interception
    # is not blocked at the NetworkPolicy layer. When Istio is disabled (dev/test),
    # xpack security handles authentication; restrict further if required by policy.
    - ports:
        - port: 9200
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aimlp-search.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9200
        - port: 9300
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if and .Values.snapshot.enabled (eq .Values.snapshot.repository.type "s3") }}
    # S3 snapshot endpoint egress -- port matches configured protocol.
    - ports:
        - port: {{ if eq .Values.snapshot.repository.s3.protocol "https" }}443{{ else }}80{{ end }}
          protocol: TCP
    {{- end }}
    {{- if .Values.istio.enabled }}
    # istiod control-plane egress -- required for Envoy sidecar XDS config and mTLS cert issuance.
    # Without this rule the sidecar cannot bootstrap and the pod never reaches Ready.
    - ports:
        - port: 15012
          protocol: TCP
        - port: 15010
          protocol: TCP
    {{- end }}
{{- end }}
