{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "es-poc-cluster.serviceAccountName" . }}
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
  {{- if and .Values.snapshot.enabled (eq .Values.snapshot.repository.type "s3") .Values.snapshot.repository.s3.irsa.roleArn }}
  annotations:
    # IRSA: allows ES pods to assume this IAM role via the projected service account
    # token without any static credentials in the chart or keystore.
    eks.amazonaws.com/role-arn: {{ .Values.snapshot.repository.s3.irsa.roleArn | quote }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
