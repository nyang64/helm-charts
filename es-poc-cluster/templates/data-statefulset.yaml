apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}-data
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
    role: data
spec:
  serviceName: {{ include "es-poc-cluster.fullname" . }}-data-headless
  replicas: {{ .Values.data.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "es-poc-cluster.selectorLabels" . | nindent 6 }}
      role: data
  template:
    metadata:
      labels:
        {{- include "es-poc-cluster.selectorLabels" . | nindent 8 }}
        role: data
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/elasticsearch-config.yaml") . | sha256sum }}
        checksum/roles: {{ include (print $.Template.BasePath "/es-roles-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/bootstrap-secret.yaml") . | sha256sum }}
        {{- if .Values.istio.enabled }}
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/excludeInboundPorts: "9300"
        traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
        {{- end }}
    spec:
      serviceAccountName: {{ include "es-poc-cluster.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "es-poc-cluster.antiAffinity" (list . "data" .Values.data.antiAffinity) | nindent 6 }}
      {{- if or .Values.sysctl.enabled (and .Values.snapshot.enabled (eq .Values.snapshot.repository.type "s3") .Values.snapshot.repository.s3.credentialsSecret) }}
      initContainers:
        {{- if .Values.sysctl.enabled }}
        - name: sysctl
          image: busybox:1.36.1
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
        {{- end }}
        {{- include "es-poc-cluster.keystoreInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: {{ include "es-poc-cluster.httpScheme" . }}
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: node.roles
              value: "data,ingest"
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.data.heapSize }} -Xmx{{ .Values.data.heapSize }}"
            - name: discovery.seed_hosts
              value: {{ include "es-poc-cluster.fullname" . }}-master-headless
            {{- if .Values.security.enabled }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticPassword.existingSecret | default (printf "%s-bootstrap" (include "es-poc-cluster.fullname" .)) }}
                  key: ELASTIC_PASSWORD
            {{- end }}
          resources:
            {{- toYaml .Values.data.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf{{ if and .Values.tls.enabled (not .Values.istio.enabled) }} -k{{ end }}{{ if .Values.security.enabled }} -u "elastic:${ELASTIC_PASSWORD}"{{ end }} "{{ include "es-poc-cluster.httpScheme" . }}://localhost:9200/_cluster/health?local=true"'
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf{{ if and .Values.tls.enabled (not .Values.istio.enabled) }} -k{{ end }}{{ if .Values.security.enabled }} -u "elastic:${ELASTIC_PASSWORD}"{{ end }} "{{ include "es-poc-cluster.httpScheme" . }}://localhost:9200/_cluster/health?local=true"'
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf{{ if and .Values.tls.enabled (not .Values.istio.enabled) }} -k{{ end }}{{ if .Values.security.enabled }} -u "elastic:${ELASTIC_PASSWORD}"{{ end }} "{{ include "es-poc-cluster.httpScheme" . }}://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"'
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: es-config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
            - name: es-roles
              mountPath: /usr/share/elasticsearch/config/roles.yml
              subPath: roles.yml
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: /usr/share/elasticsearch/config/certs
              readOnly: true
            {{- end }}
            {{- include "es-poc-cluster.keystoreVolumeMount" . | nindent 12 }}
      volumes:
        - name: es-config
          configMap:
            name: {{ include "es-poc-cluster.fullname" . }}-config
        - name: es-roles
          configMap:
            name: {{ include "es-poc-cluster.fullname" . }}-roles
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ include "es-poc-cluster.tlsSecretName" . }}
        {{- end }}
        {{- include "es-poc-cluster.keystoreVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.data.storage.storageClassName }}
        storageClassName: {{ .Values.data.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.data.storage.size }}
