apiVersion: v1
kind: Service
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}-ingest
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
    role: ingest
spec:
  selector:
    {{- include "es-poc-cluster.selectorLabels" . | nindent 4 }}
    role: ingest
  ports:
    - name: transport
      port: 9300
      targetPort: 9300
    - name: {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
      port: 9200
      targetPort: 9200
