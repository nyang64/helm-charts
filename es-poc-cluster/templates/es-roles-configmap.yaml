apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}-roles
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
data:
  roles.yml: |
    es_admin:
      cluster:
        - all
      indices:
        - names: ["*"]
          privileges:
            - all

    es_data_user:
      cluster:
        - monitor
      indices:
        - names: ["*"]
          privileges:
            - read
            - write
            - create_index   # write does not include index creation; apps that auto-create indices need this

  {{- if or .Values.ad.enabled .Values.jwt.enabled }}
  role_mapping.yml: |
    es_admin:
      {{- if .Values.ad.enabled }}
      - {{ .Values.ad.adminGroupDn | quote }}
      {{- end }}
      {{- if .Values.jwt.enabled }}
      - {{ .Values.jwt.adminGroup | quote }}
      {{- end }}
    es_data_user:
      {{- if .Values.ad.enabled }}
      - {{ .Values.ad.dataUserGroupDn | quote }}
      {{- end }}
      {{- if .Values.jwt.enabled }}
      - {{ .Values.jwt.dataUserGroup | quote }}
      {{- end }}
  {{- end }}
