apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}-roles
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
data:
  roles.yml: |
    es_admin:
      cluster:
        - all
      indices:
        - names: ["*"]
          privileges:
            - all

    es_data_user:
      cluster:
        - monitor
      indices:
        - names: ["*"]
          privileges:
            - read
            - write
            - create_index   # write does not include index creation; apps that auto-create indices need this

  {{- if .Values.ad.enabled }}
  {{- /* role_mapping.yml is only read by LDAP/AD realms. JWT realm ignores this file entirely --
       JWT role mapping must be configured via the _security/role_mapping API after the cluster is
       healthy. See the NOTES.txt runbook for the exact API calls. */}}
  role_mapping.yml: |
    es_admin:
      - {{ .Values.ad.adminGroupDn | quote }}
    es_data_user:
      - {{ .Values.ad.dataUserGroupDn | quote }}
  {{- end }}
