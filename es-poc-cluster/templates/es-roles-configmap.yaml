apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aimlp-search.fullname" . }}-roles
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
data:
  roles.yml: |
    es_admin:
      cluster:
        - all
      indices:
        - names: ["*"]
          privileges:
            - all

    es_data_user:
      cluster:
        - monitor
      indices:
        - names: ["*"]
          privileges:
            - read
            - write
            - create_index   # write does not include index creation; apps that auto-create indices need this

