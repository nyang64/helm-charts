{{- if and .Values.ingest.mlEnabled .Values.ml.installJob }}
# Standalone Job -- NOT a Helm hook. Apply manually after the cluster is healthy:
#
#   kubectl apply -f <(helm template <release-name> . \
#     -f environments/<your-env>.yaml \
#     --show-only templates/model-loader-job.yaml \
#     --set ml.installJob=true) -n <namespace>
#
# The Job downloads the model from HuggingFace (or an internal mirror via ml.hubUrl),
# converts it to TorchScript, uploads it to ES, and starts it on the ingest+ml pods.
#
# To load a different model, delete this Job first then re-apply with updated ml.modelId:
#   kubectl delete job {{ include "es-poc-cluster.fullname" . }}-model-loader -n <namespace>
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}-model-loader
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-loader
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 3600   # hard stop after 1 h -- large models can be slow to upload
  template:
    metadata:
      labels:
        {{- include "es-poc-cluster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: model-loader
      {{- if .Values.istio.enabled }}
      annotations:
        # In a STRICT mTLS namespace the Job pod needs an Envoy sidecar to reach ES.
        sidecar.istio.io/inject: "true"
        # holdApplicationUntilProxyStarts ensures the Envoy sidecar is ready before eland
        # starts -- without this, the first ES request may fail while the proxy is still
        # initialising. The shell wrapper below calls quitquitquit after eland exits to
        # shut down the sidecar (required on Istio < 1.22 / K8s < 1.29 which lack native
        # sidecar lifecycle support for Jobs).
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "es-poc-cluster.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-loader
          image: {{ .Values.ml.elandImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              eland_import_hub_model \
                --url "{{ include "es-poc-cluster.httpScheme" . }}://{{ include "es-poc-cluster.fullname" . }}-ingest:9200" \
                {{- if .Values.security.enabled }}
                --es-username elastic --es-password "${ELASTIC_PASSWORD}" \
                {{- end }}
                --hub-model-id {{ .Values.ml.modelId | quote }} \
                --task-type {{ .Values.ml.taskType | quote }} \
                {{- if and .Values.ml.insecure .Values.tls.enabled (not .Values.istio.enabled) }}
                --insecure \
                {{- end }}
                --start
              EXIT=$?
              {{- if .Values.istio.enabled }}
              curl -fsS -X POST http://localhost:15020/quitquitquit || true
              {{- end }}
              exit $EXIT
          env:
            {{- if .Values.security.enabled }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticPassword.existingSecret | default (printf "%s-bootstrap" (include "es-poc-cluster.fullname" .)) }}
                  key: ELASTIC_PASSWORD
            {{- end }}
            - name: HF_ENDPOINT
              value: {{ .Values.ml.hubUrl | quote }}
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"    # eland holds the converted model in memory during upload
            limits:
              cpu: "2000m"
              memory: "4Gi"
{{- end }}
