{{- if and .Values.security.enabled (not .Values.elasticPassword.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aimlp-search.fullname" . }}-bootstrap
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
type: Opaque
stringData:
  ELASTIC_PASSWORD: {{ .Values.elasticPassword.password | quote }}
{{- end }}
