{{- if and .Values.istio.enabled .Values.istio.gateway.hostname }}
# Binds to the shared Istio ingress gateway pod (selected by istio.gateway.selector).
# Listens on 443/HTTPS for the external ES hostname; TLS terminated here.
# The gateway pod lives in istio-system — it was deployed by the platform team, not this chart.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
  - hosts:
    - {{ .Values.istio.gateway.hostname | quote }}
    port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: {{ .Values.istio.gateway.tls.mode }}
      credentialName: {{ .Values.istio.gateway.tls.credentialName | quote }}
{{- end }}
