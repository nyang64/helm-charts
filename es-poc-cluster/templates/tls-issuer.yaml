{{- if .Values.tls.enabled }}
# Step 1: bootstrap issuer -- only used to sign the CA cert below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "aimlp-search.tlsIssuerName" . }}-bootstrap
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
# Step 2: CA certificate -- isCA:true causes cert-manager to populate ca.crt in the Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aimlp-search.tlsIssuerName" . }}-ca
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "aimlp-search.fullname" . }}-ca
  secretName: {{ include "aimlp-search.tlsIssuerName" . }}-ca
  issuerRef:
    name: {{ include "aimlp-search.tlsIssuerName" . }}-bootstrap
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
---
# Step 3: CA issuer -- issues the cluster cert with a real ca.crt bundle.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "aimlp-search.tlsIssuerName" . }}
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "aimlp-search.tlsIssuerName" . }}-ca
{{- end }}
