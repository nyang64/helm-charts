apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "es-poc-cluster.fullname" . }}-ingest
  labels:
    {{- include "es-poc-cluster.labels" . | nindent 4 }}
    role: ingest
spec:
  serviceName: {{ include "es-poc-cluster.fullname" . }}-ingest-headless
  replicas: {{ .Values.ingest.replicas }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "es-poc-cluster.selectorLabels" . | nindent 6 }}
      role: ingest
  template:
    metadata:
      labels:
        {{- include "es-poc-cluster.selectorLabels" . | nindent 8 }}
        role: ingest
    spec:
      serviceAccountName: {{ include "es-poc-cluster.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "es-poc-cluster.antiAffinity" (list . "ingest" .Values.ingest.antiAffinity) | nindent 6 }}
      {{- if .Values.sysctl.enabled }}
      initContainers:
        - name: sysctl
          image: busybox:1.36.1
          securityContext:
            privileged: true
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
      {{- end }}
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: node.roles
              value: "{{ if .Values.ingest.mlEnabled }}ingest,ml{{ else }}ingest{{ end }}"
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.ingest.heapSize }} -Xmx{{ .Values.ingest.heapSize }}"
            - name: discovery.seed_hosts
              value: {{ include "es-poc-cluster.fullname" . }}-master-headless
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticPassword.existingSecret | default (printf "%s-bootstrap" (include "es-poc-cluster.fullname" .)) }}
                  key: ELASTIC_PASSWORD
            {{- if .Values.ad.enabled }}
            - name: AD_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ad.existingSecret | default (printf "%s-ad-secret" (include "es-poc-cluster.fullname" .)) }}
                  key: AD_BIND_PASSWORD
            {{- end }}
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf -k -u "elastic:${ELASTIC_PASSWORD}" {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}://localhost:9200/_cluster/health'
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf -k -u "elastic:${ELASTIC_PASSWORD}" "{{ if .Values.tls.enabled }}https{{ else }}http{{ end }}://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"'
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: es-config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
            - name: es-roles
              mountPath: /usr/share/elasticsearch/config/roles.yml
              subPath: roles.yml
              readOnly: true
            {{- if .Values.ad.enabled }}
            - name: es-roles
              mountPath: /usr/share/elasticsearch/config/role_mapping.yml
              subPath: role_mapping.yml
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: /usr/share/elasticsearch/config/certs
              readOnly: true
            {{- end }}
      volumes:
        - name: es-config
          configMap:
            name: {{ include "es-poc-cluster.fullname" . }}-config
        - name: es-roles
          configMap:
            name: {{ include "es-poc-cluster.fullname" . }}-roles
        {{- if not .Values.ingest.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
  {{- if .Values.ingest.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.ingest.storage.storageClassName }}
        storageClassName: {{ .Values.ingest.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ingest.storage.size }}
  {{- end }}
