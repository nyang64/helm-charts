{{- if and .Values.istio.enabled .Values.istio.gateway.hostname }}
# Routes external traffic from the Gateway to the ES client service.
# Internal mesh traffic continues to reach ES directly via ClusterIP -- this VS
# only handles the north-south path from the Istio ingress gateway pod.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "aimlp-search.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aimlp-search.labels" . | nindent 4 }}
spec:
  hosts:
  - {{ .Values.istio.gateway.hostname | quote }}
  gateways:
  - {{ include "aimlp-search.fullname" . }}
  http:
  - route:
    - destination:
        host: {{ include "aimlp-search.fullname" . }}
        port:
          number: 9200
{{- end }}
