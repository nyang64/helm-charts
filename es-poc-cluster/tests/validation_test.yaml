suite: "validation -- fail guards for incompatible value combinations"
values:
  - values/base.yaml

tests:

  # ── security+tls mutual dependency ────────────────────────────────────────

  - it: "fails when security=true and tls=false"
    template: templates/validation.yaml
    set:
      tls.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: security.enabled=true requires tls.enabled=true. ES transport TLS (port 9300) needs cert-manager certificates regardless of istio.enabled -- Istio only handles HTTP TLS (port 9200). Set security.enabled=false only for isolated dev/test."

  - it: "fails when tls=true and security=false"
    template: templates/validation.yaml
    set:
      security.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: tls.enabled=true requires security.enabled=true. ES does not configure any TLS when xpack.security is off, so httpScheme would resolve to https against a plain-HTTP listener. Set tls.enabled=false for security-off deployments."

  - it: "passes when both security and tls are disabled"
    template: templates/validation.yaml
    set:
      security.enabled: false
      tls.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ── snapshot endpoint guard (ES 9.x: no protocol prefix) ──────────────────

  - it: "fails when snapshot endpoint has https:// prefix"
    template: templates/validation.yaml
    set:
      snapshot.enabled: true
      snapshot.repository.s3.bucket: "es-snapshots"
      snapshot.repository.s3.endpoint: "https://minio.example.com"
      snapshot.repository.s3.credentialsSecret: "s3-creds"
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: snapshot.repository.s3.endpoint must be a bare hostname (no protocol prefix). The chart prepends snapshot.repository.s3.protocol to form the full URL required by ES 9.x. Example: 'netapp-hpos.your-corp.internal'"

  - it: "fails when snapshot endpoint has http:// prefix"
    template: templates/validation.yaml
    set:
      snapshot.enabled: true
      snapshot.repository.s3.bucket: "es-snapshots"
      snapshot.repository.s3.endpoint: "http://minio.internal"
      snapshot.repository.s3.credentialsSecret: "s3-creds"
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: snapshot.repository.s3.endpoint must be a bare hostname (no protocol prefix). The chart prepends snapshot.repository.s3.protocol to form the full URL required by ES 9.x. Example: 'netapp-hpos.your-corp.internal'"

  # ── snapshot enabled: required fields ────────────────────────────────────

  - it: "fails when snapshot enabled without bucket"
    template: templates/validation.yaml
    set:
      snapshot.enabled: true
      snapshot.repository.s3.bucket: ""
      snapshot.repository.s3.endpoint: "minio.example.com"
      snapshot.repository.s3.credentialsSecret: "s3-creds"
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: snapshot.enabled=true requires snapshot.repository.s3.bucket."

  - it: "fails when snapshot enabled without endpoint"
    template: templates/validation.yaml
    set:
      snapshot.enabled: true
      snapshot.repository.s3.bucket: "es-snapshots"
      snapshot.repository.s3.endpoint: ""
      snapshot.repository.s3.credentialsSecret: "s3-creds"
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: snapshot.enabled=true requires snapshot.repository.s3.endpoint (e.g. 'netapp-hpos.your-corp.internal'). On-prem S3 does not use AWS endpoint discovery."

  - it: "fails when snapshot enabled without credentialsSecret"
    template: templates/validation.yaml
    set:
      snapshot.enabled: true
      snapshot.repository.s3.bucket: "es-snapshots"
      snapshot.repository.s3.endpoint: "minio.example.com"
      snapshot.repository.s3.credentialsSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: snapshot.enabled=true requires snapshot.repository.s3.credentialsSecret. On-prem S3 (NetApp HPOS) uses static access/secret key credentials stored in a K8s Secret."

  # ── kibana: token secret required ─────────────────────────────────────────

  - it: "fails when kibana enabled without serviceAccountToken secret"
    template: templates/validation.yaml
    set:
      kibana.enabled: true
      kibana.serviceAccountToken.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: kibana.enabled=true requires kibana.serviceAccountToken.existingSecret. Create a K8s Secret with key 'token' containing the ES service account token before installing."

  # ── elasticPassword validation ────────────────────────────────────────────

  - it: "fails when security enabled and both password and existingSecret are empty"
    template: templates/validation.yaml
    set:
      elasticPassword.existingSecret: ""
      elasticPassword.password: ""
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: elasticPassword.password is empty. ES only sets the bootstrap password when the env var is non-empty. Set a strong password or use elasticPassword.existingSecret."

  - it: "fails when password starts with 'changeme'"
    template: templates/validation.yaml
    set:
      elasticPassword.existingSecret: ""
      elasticPassword.password: "changeme123"
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: elasticPassword.password starts with 'changeme'. Set a strong unique password or reference a pre-created secret via elasticPassword.existingSecret."

  # ── kibana requires security ──────────────────────────────────────────────

  - it: "fails when kibana enabled and security disabled"
    template: templates/validation.yaml
    set:
      security.enabled: false
      tls.enabled: false
      kibana.enabled: true
      kibana.serviceAccountToken.existingSecret: "kibana-token"
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: kibana.enabled=true requires security.enabled=true. Kibana 9.x authenticates via ES service account tokens and xpack.security -- it cannot connect to an ES cluster with security disabled."

  # ── multi-replica / rolling-update requires encryption keys ───────────────

  - it: "fails when kibana.replicas > 1 without encryptionKeys"
    template: templates/validation.yaml
    set:
      kibana.enabled: true
      kibana.serviceAccountToken.existingSecret: "kibana-token"
      kibana.replicas: 2
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: kibana.replicas > 1 requires kibana.encryptionKeys.existingSecret. Without shared encryption keys, each pod generates its own -- sessions and encrypted saved objects will fail across pod boundaries. Create a secret with keys: security, savedObjects, reporting."

  - it: "fails when kibana.updateStrategy=RollingUpdate without encryptionKeys"
    template: templates/validation.yaml
    set:
      kibana.enabled: true
      kibana.serviceAccountToken.existingSecret: "kibana-token"
      kibana.updateStrategy: RollingUpdate
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: kibana.updateStrategy=RollingUpdate requires kibana.encryptionKeys.existingSecret. During a rolling rollout two pods overlap; without shared keys their session and reporting stores are incompatible. Create a secret with keys: security, savedObjects, reporting."

  # ── removed setting guards ────────────────────────────────────────────────

  - it: "fails when deprecated 'ml' block is present"
    template: templates/validation.yaml
    set:
      ml.installJob: "true"
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: the 'ml' block is no longer supported. ML role support and the model-loader Job were removed in v0.5.0. Remove the 'ml' key from your values file."

  - it: "fails when deprecated 'ingest' block is present"
    template: templates/validation.yaml
    set:
      ingest.replicas: 3
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: the 'ingest' block is no longer supported. The dedicated ingest StatefulSet was removed in v0.6.0; ingest pipelines now run on data nodes (data+ingest roles). Remove the 'ingest' key from your values file."

  - it: "fails when deprecated pdb.ingest is present"
    template: templates/validation.yaml
    set:
      pdb.ingest.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "Invalid configuration: pdb.ingest is no longer supported. The ingest StatefulSet was removed in v0.6.0. Remove 'pdb.ingest' from your values file."

  # ── clean base values pass validation ─────────────────────────────────────

  - it: "no validation error with valid base values"
    template: templates/validation.yaml
    asserts:
      - hasDocuments:
          count: 0
