# Cluster-wide settings
clusterName: es-poc-cluster

image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  # tag: pin to an exact patch version in production. Mutable tags (e.g. "8.17") mean
  # `helm upgrade` may silently roll all pods to a newer ES version when nodes pull a fresh image,
  # potentially causing a rolling upgrade without operator awareness.
  tag: "8.17.7"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""              # leave empty to derive from fullnameOverride (recommended)
  automountServiceAccountToken: false

rbac:
  create: true

# Bootstrap elastic superuser password -- required for probes and initial cluster access.
# Use existingSecret in production. NEVER leave password as "changeme" in real deployments.
elasticPassword:
  existingSecret: ""      # name of pre-existing K8s secret with key ELASTIC_PASSWORD
  password: "changeme"    # used only when existingSecret is empty

# Elasticsearch security -- disable only for isolated dev/test environments
security:
  enabled: true           # if false, sets xpack.security.enabled: false (insecure)

# sysctl init container sets vm.max_map_count=262144.
# Requires privileged pods. Disable if nodes already have this set at node level.
sysctl:
  enabled: true

# bootstrap.memory_lock (mlockall) is NOT enabled by this chart.
# To enable it you need ALL of the following simultaneously, which is complex in K8s:
#   1. ES config: bootstrap.memory_lock: true
#   2. Container securityContext: capabilities.add: [IPC_LOCK]
#   3. Pod securityContext or ulimit: memlock unlimited (requires privileged or a custom limit plugin)
#   4. Node-level OS: must honor RLIMIT_MEMLOCK for the container process
# In practice, K8s PodSecurityAdmission "restricted" profile blocks IPC_LOCK. Only enable
# if your cluster permits privileged pods and the node OS is tuned accordingly.
# Without memory_lock, the OS may swap ES heap pages under memory pressure -- avoid this
# by setting memory requests == limits (Guaranteed QoS) as done in this chart.

# Master nodes -- control the cluster (elections, metadata)
# CPU: requests < limits (Burstable QoS) is intentional for ES. CPU throttling slows
# operations but does not cause data loss. Memory requests == limits (Guaranteed QoS) is
# the critical constraint -- heap OOM kills are fatal and cannot be caught by ES.
master:
  replicas: 3
  heapSize: "512m"
  antiAffinity: "required"    # required | preferred | disabled
  bootstrapped: false         # set to true after initial cluster formation to remove cluster.initial_master_nodes
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  storage:
    size: "10Gi"
    storageClassName: ""      # leave empty to use cluster default StorageClass

# Data nodes -- store and search the data
data:
  replicas: 6
  heapSize: "1g"
  antiAffinity: "preferred"   # required | preferred | disabled
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  storage:
    size: "100Gi"
    storageClassName: ""

# Ingest nodes -- pre-process documents and optionally run ML embedding inference.
# mlEnabled: true adds the 'ml' role so these pods host the embedding model.
# When enabled, increase memory to cover model weights loaded into native (off-heap) memory:
#   container RAM = heap x 2 (standard ES rule) + ML model weights (~4-8 Gi typical)
ingest:
  replicas: 2
  heapSize: "512m"
  mlEnabled: false          # set true to combine ingest + ml roles on the same pods
  antiAffinity: "preferred"
  persistence:
    enabled: false            # uses emptyDir by default; enable for ingest attachment pipelines
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  storage:                     # only used when persistence.enabled=true
    size: "10Gi"
    storageClassName: ""

# IMPORTANT -- PVC template immutability:
# StatefulSet volumeClaimTemplates are immutable in Kubernetes. After the initial install:
#   - Changing storage.size, storage.storageClassName, or accessModes CANNOT be applied via
#     helm upgrade -- the StatefulSet update will be rejected by the API server.
#   - To resize PVCs: delete the StatefulSet (cascade=orphan to keep pods), update the PVCs
#     manually, then re-install the chart.
#   - To change storage class: full data migration to new PVCs is required.
# Plan your storage capacity before the first install; treat PVC config as immutable thereafter.

# NetworkPolicy -- controls pod-level ingress/egress.
# Disable if your cluster manages NetworkPolicies centrally, has a CNI that doesn't support
# them, or if you need to temporarily bypass for debugging. Re-enable for all production deploys.
networkPolicy:
  enabled: true

# Istio service mesh integration.
# When enabled:
#   - HTTP TLS (port 9200) is handled by Envoy mTLS -- ES listens plain HTTP internally
#   - Transport TLS (port 9300) stays with cert-manager -- ES uses it for node authentication
#   - PeerAuthentication (STRICT mTLS) and AuthorizationPolicy are deployed
#   - Port 9300 is excluded from Istio interception via pod annotations
# When disabled: all TLS is managed by cert-manager (or none if tls.enabled=false).
istio:
  enabled: false
  gateway:
    # selector must match the labels on the shared Istio ingress gateway pod.
    # Verify with: kubectl get pods -n istio-system --show-labels | grep gateway
    selector:
      istio: ingressgateway
    # hostname: external FQDN for this ES cluster. When set, a Gateway CRD and VirtualService
    # are deployed. Leave empty to skip external access (mesh-internal only).
    hostname: ""
    tls:
      # SIMPLE: gateway terminates TLS, forwards plain HTTP to ES pods (recommended).
      # PASSTHROUGH: not supported -- ES HTTP TLS is disabled when istio.enabled=true.
      mode: SIMPLE
      # credentialName: K8s secret in the istio-system namespace holding the TLS cert.
      # Required when mode=SIMPLE. Create with:
      #   kubectl create secret tls <name> --cert=tls.crt --key=tls.key -n istio-system
      # or via a cert-manager Certificate resource targeting the istio-system namespace.
      credentialName: ""
  # allowedNamespaces: additional K8s namespaces whose pods may reach ES on port 9200.
  # The ES namespace itself is always allowed. Add any namespace that runs client workloads
  # (application pods, batch jobs, etc.) that call ES directly over east-west Istio mTLS.
  # The AuthorizationPolicy controls network access;
  # ES xpack security controls what the caller is allowed to do once connected.
  # Add Kibana's namespace here when istio.enabled=true (see kibana.namespace below).
  allowedNamespaces: []
  # Example:
  #   allowedNamespaces:
  #     - "my-app"
  #     - "ml-pipelines"

tls:
  enabled: true
  secretName: ""    # defaults to <fullname>-tls; set explicitly to share a cert across releases
  issuerName: ""    # defaults to <fullname>-issuer; must match the cert-manager Issuer you deploy
  duration: "8760h"     # 1 year cert validity; cert-manager default is 90 days
  renewBefore: "720h"   # begin renewal 30 days before expiry; allows time for rolling restart

# Extra elasticsearch.yml settings -- merged after the generated config.
# Use for any setting not exposed as a dedicated value (disk watermarks,
# reindex remote whitelist, circuit breakers, custom thread pools, etc.).
# Values are typed: strings, numbers, booleans, and lists all work.
# Avoid overriding keys already generated by this chart (cluster.name,
# xpack.security.*) -- YAML does not allow duplicate keys.
#
# Example:
#   esConfig:
#     cluster.routing.allocation.disk.watermark.low: "85%"
#     cluster.routing.allocation.disk.watermark.high: "90%"
#     cluster.routing.allocation.disk.watermark.flood_stage: "95%"
#     indices.memory.index_buffer_size: "256mb"   # accepts byte units or % (e.g. "10%")
#     reindex.remote.whitelist: "otherhost:9200"
esConfig: {}

# Snapshot repository and Snapshot Lifecycle Management (SLM).
# Snapshots protect against logical corruption, accidental deletes, and full
# cluster loss -- scenarios where replicas offer no protection. The repository
# must live outside the cluster (S3, GCS, Azure Blob) so it survives a total
# cluster failure.
#
# After deploying with snapshot.enabled=true, follow the NOTES runbook step to
# register the repository and create the SLM policy via the ES API.
snapshot:
  enabled: false
  repository:
    name: "backup"          # ES internal name used in _snapshot/<name> API calls
    type: "s3"              # s3 | gcs | azure
    s3:
      bucket: ""            # S3 bucket name -- must exist before repo registration
      basePath: "elasticsearch"   # key prefix within the bucket
      # endpoint: S3-compatible host (no protocol prefix) for on-prem backends
      # (NetApp ONTAP S3, StorageGRID, MinIO, etc.). Leave empty for AWS S3 -- the
      # SDK resolves the regional endpoint from the bucket automatically.
      # Example: "netapp-hpos.your-corp.internal"
      endpoint: ""
      pathStyleAccess: true     # true for on-prem S3; false for AWS virtual-hosted style
      protocol: "https"
      # credentialsSecret: K8s secret holding S3 access credentials for on-prem S3.
      # Mutually exclusive with irsa.roleArn. Secret must have keys: access_key, secret_key.
      # Create with:
      #   kubectl create secret generic es-snapshot-s3-creds \
      #     --from-literal=access_key=<key> \
      #     --from-literal=secret_key=<secret> -n <namespace>
      # The chart provisions a keystore-init container that loads these into the ES keystore
      # on every pod start -- credentials are never stored in plaintext on disk.
      credentialsSecret: ""
      # irsa.roleArn: AWS EKS only. ES pods assume this IAM role via IRSA without any static
      # credentials. Mutually exclusive with credentialsSecret.
      # Requires serviceAccount.automountServiceAccountToken: true.
      # Required IAM actions: s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket,
      # s3:GetBucketLocation, s3:ListBucketMultipartUploads, s3:ListMultipartUploadParts,
      # s3:AbortMultipartUpload
      irsa:
        roleArn: ""         # e.g. "arn:aws:iam::123456789012:role/es-snapshot-role"
    gcs:
      bucket: ""            # GCS bucket name
      basePath: "elasticsearch"
      # Use GKE Workload Identity -- annotate the ServiceAccount externally.
      # No credentials in this chart; GCS plugin reads the metadata server.
    azure:
      container: ""         # Azure Blob container name
      basePath: "elasticsearch"
      # Use AKS Managed Identity -- no credentials in this chart.
  slm:
    schedule: "0 30 1 * * ?"   # ES cron (UTC) -- default: daily at 01:30
    retention:
      expireAfter: "30d"    # delete snapshots older than this
      minCount: 5           # always keep at least this many regardless of expiry
      maxCount: 50          # never keep more than this many

# Kibana integration.
# Set namespace to the K8s namespace where Kibana is deployed.
# When set, the NOTES runbook includes a step for creating the ES service account token
# and wiring it into the elastic/kibana Helm chart.
# When istio.enabled=true, also add this namespace to istio.allowedNamespaces so the
# Istio AuthorizationPolicy permits Kibana pods to reach ES on port 9200.
kibana:
  namespace: ""   # e.g. "kibana" or "elastic"

probes:
  startup:
    # Startup probe runs before liveness; liveness is disabled until it passes.
    # Allows up to periodSeconds * failureThreshold = 300 s for ES to start.
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  liveness:
    # initialDelaySeconds can be 0 when startupProbe is used, but kept non-zero
    # as a safety margin for clusters that don't support startup probes.
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

# PodDisruptionBudgets -- minAvailable is capped to replicas automatically
pdb:
  master:
    enabled: true
    minAvailable: 2
  data:
    enabled: true
    minAvailable: 1
  ingest:
    enabled: true
    minAvailable: 1   # always keep at least 1 ingest pod -- it is the sole client entry point

# ML model loader -- standalone Job applied manually after the cluster is healthy.
# Usage (after helm install):
#   kubectl apply -f <(helm template es-poc-cluster . \
#     --show-only templates/model-loader-job.yaml) -n <namespace>
# To swap models, delete the old Job first:
#   kubectl delete job <release>-model-loader -n <namespace>
#
# Only rendered when ingest.mlEnabled=true.
#
# Embedding model options (all open-source, loadable via eland from HuggingFace):
#
# Model ID                                   Dims   Size    License     Notes
# -----------------------------------------  ----  ------  ----------  ------------------------------------------
# sentence-transformers/all-MiniLM-L6-v2      384   22 MB  Apache 2.0  Fastest; lowest RAM; good for high throughput
# BAAI/bge-small-en-v1.5                      384   44 MB  MIT         Best quality-to-size ratio on MTEB
# intfloat/e5-small-v2                        384   44 MB  MIT         Strong on QA/RAG tasks; fast inference
# BAAI/bge-base-en-v1.5                       768  110 MB  MIT         Recommended: strong quality, manageable size
# intfloat/e5-base-v2                         768  110 MB  MIT         Solid RAG performance; similar to bge-base
# nomic-ai/nomic-embed-text-v1.5              768  137 MB  Apache 2.0  MRL support: truncatable to 512 or 256 dims
# sentence-transformers/all-mpnet-base-v2     768  420 MB  Apache 2.0  High quality general-purpose model
# BAAI/bge-large-en-v1.5                     1024  335 MB  MIT         High quality; needs 24Gi+ ingest pod RAM
# intfloat/multilingual-e5-large             1024  560 MB  MIT         Best multilingual option
# BAAI/bge-m3                                1024  570 MB  MIT         Multilingual; dense+sparse+colbert in one model
#
ml:
  # installJob: controls whether the model-loader Job is created during helm install/upgrade.
  # Default false -- the cluster must be healthy before the Job runs or it will exhaust retries.
  # Apply manually after STEP 1 (pods ready) using the command in the NOTES runbook, which
  # passes --set ml.installJob=true to render the Job on demand.
  installJob: false
  modelId: "BAAI/bge-base-en-v1.5"   # HuggingFace model ID to load
  taskType: "text_embedding"
  # hubUrl: override to point at an internal HuggingFace mirror for air-gapped clusters.
  # The eland Job sets HF_ENDPOINT to this value.
  hubUrl: "https://huggingface.co"
  # insecure: skip TLS certificate verification when connecting to ES.
  # Set true when using self-signed certs (the default cert-manager setup in this chart).
  insecure: true
  # eland does not publish patch-level images; tag tracks ES major.minor only.
  elandImage: "docker.elastic.co/eland/eland:8.17.0"

