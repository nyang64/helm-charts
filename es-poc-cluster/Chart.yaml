apiVersion: v2
name: es-poc-cluster
description: Elasticsearch cluster with master, data, and ingest roles — secured with TLS, xpack.security, and optional AD auth
type: application
version: 0.3.0
appVersion: "8.17.7"
annotations:
  artifacthub.io/prereqs: |
    - cert-manager v1.x must be installed when tls.enabled=true
    - Nodes must allow privileged pods, or vm.max_map_count=262144 must be preset, when sysctl.enabled=true
