apiVersion: v2
name: aimlp-search
description: Elasticsearch cluster with master and data nodes (data+ingest roles) -- secured with TLS, xpack.security, and API key authentication
type: application
version: 0.8.0
appVersion: "9.4.5"
annotations:
  artifacthub.io/prereqs: |
    - cert-manager v1.x must be installed when tls.enabled=true
    - Nodes must allow privileged pods, or vm.max_map_count=262144 must be preset, when sysctl.enabled=true
    - Istio service mesh must be installed when istio.enabled=true
